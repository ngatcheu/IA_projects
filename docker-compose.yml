# Qdrant partagé pour le code de src/ (en cours de migration vers les modules).
# Chaque module a son propre docker-compose dans Formations/module-XX-*/.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"   # API REST + tableau de bord : http://localhost:6333/dashboard
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
